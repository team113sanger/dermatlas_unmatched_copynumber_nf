# Publishes the contents of assets/ as a release bundle that `dermanager projectify`
# downloads over the GitHub release CDN (no API call, no auth, no rate limit).
#
# This repository is GitHub-primary. It was previously GitLab-primary and push-mirrored
# to GitHub; that mirror was retired and the GitLab project archived.
#
# Consumer URLs (public, unauthenticated):
#   https://github.com/<owner>/<repo>/releases/download/<ref>/projectify_asset_bundle.tar.gz
#   https://github.com/<owner>/<repo>/releases/download/<ref>/projectify_asset_bundle.tar.gz.sha256
# where <ref> is a release tag (X.Y.Z), or the rolling channels main-latest / develop-latest.
name: Publish projectify asset bundle

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Backfill a bundle for a ref that predates this workflow, or re-publish one by hand.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (X.Y.Z) or branch to build the bundle from'
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: publish-assets-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref and release tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            source_ref="$INPUT_REF"
          else
            source_ref="$REF_NAME"
          fi
          if printf '%s' "$source_ref" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Versioned release: the bundle is immutable and addressed by the tag itself.
            release_tag="$source_ref"
            prerelease=false
          else
            # Rolling channel: a fixed tag that is force-moved to the head of the branch.
            release_tag="$(printf '%s' "$source_ref" | tr '/' '-')-latest"
            prerelease=true
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building bundle from '$source_ref' and publishing it as '$release_tag' (prerelease=$prerelease)."

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.source_ref }}

      - name: Build the asset bundle
        run: |
          set -euo pipefail
          test -d assets || { echo "::error::No assets/ directory at ${{ steps.resolve.outputs.source_ref }}"; exit 1; }
          tar -czf projectify_asset_bundle.tar.gz -C assets .
          sha256sum projectify_asset_bundle.tar.gz > projectify_asset_bundle.tar.gz.sha256
          echo "Bundle contents:"
          tar -tzf projectify_asset_bundle.tar.gz
          cat projectify_asset_bundle.tar.gz.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A rolling channel updates its *assets*, never its tag.
          #
          # The download URL is addressed by the tag's NAME, not by the commit it points
          # at, so there is nothing to gain by moving it - and a great deal to lose:
          # `git hf release finish` ends with `git push --tags`, which pushes every local
          # tag and is rejected outright ("already exists") by any tag that has moved on
          # the remote since the contributor's clone last fetched it. That aborts the
          # release after main, develop and the version tag have been pushed, leaving
          # release/<version> stranded on the remote. Git offers no way for a clone to
          # opt out reliably (negative fetch refspecs do not apply to automatic tag
          # following), so the fix has to live here: create the tag once, then leave it
          # alone forever.
          notes="Assets from \`$SOURCE_REF\` (\`$GITHUB_SHA\`), published automatically for \`dermanager projectify\`."
          if [ "$PRERELEASE" = "true" ]; then
            notes="Rolling bundle tracking the head of \`$SOURCE_REF\`, rebuilt $(date -u +'%Y-%m-%d %H:%M UTC').

          $notes

          The \`$RELEASE_TAG\` tag is a fixed anchor and deliberately does not move; only the
          attached bundle is replaced. The commit this bundle was built from is the SHA above,
          not the commit the tag points at."
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              projectify_asset_bundle.tar.gz projectify_asset_bundle.tar.gz.sha256 --clobber
            # The notes carry the provenance the tag no longer does, so refresh them too.
            gh release edit "$RELEASE_TAG" --notes "$notes"
          elif [ "$PRERELEASE" = "true" ]; then
            # First publish of this channel: --target pins the new tag to this commit.
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
              --title "$RELEASE_TAG" --notes "$notes" \
              projectify_asset_bundle.tar.gz projectify_asset_bundle.tar.gz.sha256
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$notes" \
              projectify_asset_bundle.tar.gz projectify_asset_bundle.tar.gz.sha256
          fi
          # GitHub demotes a release to a draft if its tag ever disappears, which makes the
          # download URL 404. Re-publishing unconditionally repairs that.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/projectify_asset_bundle.tar.gz"
